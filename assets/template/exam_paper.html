<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
    /> -->
    <style>
      /* body {
        font-family: "Roboto", sans-serif;
        font-size: 15px;
        line-height: 1.538462;
        color: #333333;
        background-color: #eee;
      } */
    </style>
  </head>
  <body>
    <table style="border: 1px solid #000; padding: 20px; width: 100%">
      <tr>
        <td style="width: 10%">
          <div style="width: 100%">
            <img
              src="[school_logo]"
              alt="School Logo"
              height="120"
              width="120"
              style="margin-bottom: 20px"
            />
            <div style="margin-top: 50px">
              <h3>Name / Index No:</h3>
            </div>
          </div>
        </td>
        <td style="width: 60%; text-align: center">
          <div style="text-align: center; text-transform: uppercase">
            <h2>[school_name]</h2>
            <h3>[subject_name]</h3>
            <h3>[exam_type] - [year]</h3>
            <h4>[class_name]</h4>
            <hr />
            <div
              style="
                font-size: 14px;
                font-weight: bold;
                color: #555;
                margin: 30px 0 20px 0;
                padding: 4px 12px;
                display: inline-block;
                background: #f5f5f5;
              "
            >
              [paper_code]
            </div>
          </div>
        </td>
        <td style="width: 20%; float: right">
          <div style="border-radius: 3px; float: right">
            <table style="border: 1px solid #000; text-align: center">
              <tr>
                <td
                  style="padding: 50px 0px; border-bottom: 1px solid #000"
                ></td>
              </tr>
              <tr>
                <td style="text-align: center">
                  <h4>MARKS ([total_marks])</h4>
                </td>
              </tr>
              <tr>
                <td>
                  <h4
                    style="
                      text-align: center;
                      font-style: italic;
                      margin-top: 1px;
                    "
                  >
                    [total_hours] hour/s
                  </h4>
                </td>
              </tr>
            </table>
          </div>
        </td>
      </tr>
    </table>
    [mcq_question_set] [structure_question_set] [essay_question_set]
  </body>
</html>
